<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helium Music - Roland FP-30X Companion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#090d16',
                        cardbg: '#131c31',
                        accent: '#38bdf8'
                    }
                }
            }
        }
    </script>
    <style>
        .piano-keyboard {
            display: flex;
            position: relative;
            height: 140px;
            background: #020617;
            border-radius: 0.75rem;
            overflow-x: auto;
            padding: 8px;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.9);
            width: 100%;
        }
        .key {
            position: relative;
            border-radius: 0 0 5px 5px;
            transition: background 0.05s ease;
            flex-shrink: 0;
            cursor: pointer;
        }
        .key.white {
            width: 24px;
            height: 125px;
            background: #f8fafc;
            border: 1px solid #94a3b8;
            z-index: 1;
        }
        .key.white.active {
            background: #38bdf8 !important;
            box-shadow: 0 0 12px #38bdf8;
        }
        .key.black {
            width: 15px;
            height: 75px;
            background: #0f172a;
            border: 1px solid #334155;
            margin-left: -7.5px;
            margin-right: -7.5px;
            z-index: 2;
            border-radius: 0 0 3px 3px;
        }
        .key.black.active {
            background: #0284c7 !important;
            box-shadow: 0 0 10px #0284c7;
        }
    </style>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen flex flex-col font-sans antialiased select-none">

    <!-- PAGE ACCUEIL (Portrait) -->
    <div id="view-home" class="flex-1 flex flex-col p-4 max-w-md w-full mx-auto justify-between space-y-4">
        <header class="bg-cardbg border border-slate-800 rounded-2xl p-4 flex items-center justify-between shadow-lg">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 p-2 rounded-xl text-white shadow-md">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l-2-2v13m2 0l12-3v-13l-12 3m-2 13l12-3" />
                    </svg>
                </div>
                <div>
                    <h1 class="font-bold text-base tracking-wide">Helium Music</h1>
                    <p class="text-xs text-slate-400">Roland FP-30X Companion</p>
                </div>
            </div>
            <div id="home-status" class="w-3 h-3 rounded-full bg-amber-500"></div>
        </header>

        <div class="flex-1 flex flex-col justify-center space-y-4">
            <button id="nav-to-keyboard" class="w-full p-6 rounded-2xl bg-gradient-to-br from-cardbg to-slate-900 border border-slate-800 hover:border-indigo-500/50 shadow-xl flex items-center space-x-4 transition group text-left">
                <div class="bg-indigo-600/20 text-indigo-400 p-4 rounded-xl group-hover:scale-105 transition border border-indigo-500/30">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
                    </svg>
                </div>
                <div>
                    <h2 class="font-bold text-lg text-slate-200">Clavier 5 Octaves</h2>
                    <p class="text-xs text-slate-400 mt-1">Visualisation en direct &amp; jeu interactif</p>
                </div>
            </button>

            <button id="btn-connect-home" class="w-full py-4 px-6 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm shadow-lg shadow-indigo-600/20 transition flex items-center justify-center space-x-2">
                <span>Connecter le Piano Bluetooth</span>
            </button>
        </div>

        <footer class="text-center text-xs text-slate-500 py-2">
            Helium Music v1.0 • PWA Ready
        </footer>
    </div>

    <!-- PAGE CLAVIER (Paysage 5 Octaves) -->
    <div id="view-keyboard" class="flex-1 hidden flex-col p-3 w-full max-w-5xl mx-auto justify-between">
        <div class="bg-cardbg border border-slate-800 rounded-2xl px-4 py-2 flex items-center justify-between shadow-md">
            <button id="nav-to-home" class="flex items-center space-x-2 bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-xl text-xs font-semibold transition border border-slate-700">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
                <span>Accueil</span>
            </button>
            <div id="chord-display" class="text-sm font-black text-cyan-400 bg-slate-900 px-4 py-1.5 rounded-xl border border-slate-800">
                -
            </div>
            <div id="keyboard-status" class="text-xs px-2.5 py-1 rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/30">
                Déconnecté
            </div>
        </div>

        <div class="bg-cardbg border border-slate-800 rounded-2xl p-4 my-2 shadow-xl flex flex-col justify-center">
            <div class="flex justify-between items-center mb-2 px-1">
                <span class="text-[10px] font-bold text-slate-400 tracking-wider uppercase">Clavier Virtuel (5 Octaves)</span>
                <span class="text-[10px] text-slate-500">Roland FP-30X</span>
            </div>
            <div id="keyboard-container" class="piano-keyboard"></div>
        </div>
    </div>

    <script>
        const viewHome = document.getElementById('view-home');
        const viewKeyboard = document.getElementById('view-keyboard');
        document.getElementById('nav-to-keyboard').addEventListener('click', () => {
            viewHome.classList.add('hidden');
            viewKeyboard.classList.remove('hidden');
        });
        document.getElementById('nav-to-home').addEventListener('click', () => {
            viewKeyboard.classList.add('hidden');
            viewHome.classList.remove('hidden');
        });

        // Gestion audio uniquement pour l'interaction tactile (si on clique sur l'écran)
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playAcousticPiano(midiNote) {
            initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const sampleUrl = `https://tonejs.github.io/audio/salamander/${getNoteNameWithOctave(midiNote)}.mp3`;

            fetch(sampleUrl)
                .then(response => response.arrayBuffer())
                .then(arrayBuffer => audioCtx.decodeAudioData(arrayBuffer))
                .then(audioBuffer => {
                    const source = audioCtx.createBufferSource();
                    const gainNode = audioCtx.createGain();
                    
                    source.buffer = audioBuffer;
                    gainNode.gain.setValueAtTime(0.8, audioCtx.currentTime);
                    
                    source.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    source.start();
                })
                .catch(err => {
                    fallbackTone(midiNote);
                });
        }

        function getNoteNameWithOctave(midi) {
            const names = ["C", "Cs", "D", "Ds", "E", "F", "Fs", "G", "Gs", "A", "As", "B"];
            const noteName = names[midi % 12];
            const octave = Math.floor(midi / 12) - 1;
            return noteName + octave;
        }

        function fallbackTone(midiNote) {
            const freq = 440 * Math.pow(2, (midiNote - 69) / 12);
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 1.5);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 1.5);
        }

        const keyboardContainer = document.getElementById('keyboard-container');
        const noteNamesGlobal = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        const keyElements = {};
        let activeNotes = new Set();

        function buildKeyboard() {
            for (let midi = 36; midi <= 96; midi++) {
                const name = noteNamesGlobal[midi % 12];
                const isBlack = name.includes('#');
                const key = document.createElement('div');
                key.className = `key ${isBlack ? 'black' : 'white'}`;
                key.dataset.midi = midi;

                // Si on clique avec la souris/doigt sur l'écran, on joue le son tactile
                key.addEventListener('mousedown', () => {
                    playAcousticPiano(midi);
                    activateKey(midi);
                });
                key.addEventListener('mouseup', () => deactivateKey(midi));
                key.addEventListener('mouseleave', () => deactivateKey(midi));

                keyboardContainer.appendChild(key);
                keyElements[midi] = key;
            }
        }
        buildKeyboard();

        function activateKey(midi) {
            activeNotes.add(midi);
            if (keyElements[midi]) keyElements[midi].classList.add('active');
            updateChordDisplay();
        }

        function deactivateKey(midi) {
            activeNotes.delete(midi);
            if (keyElements[midi]) keyElements[midi].classList.remove('active');
            updateChordDisplay();
        }

        function updateChordDisplay() {
            const chordEl = document.getElementById('chord-display');
            if (activeNotes.size === 0) {
                chordEl.textContent = "-";
                return;
            }
            const notesArray = Array.from(activeNotes).map(n => noteNamesGlobal[n % 12]);
            chordEl.textContent = notesArray.join(' - ');
        }

        // Connexion Bluetooth MIDI : UNIQUEMENT visuelle (pas de double son)
        async function connectBluetoothPiano() {
            try {
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ services: ['03b80e5a-ede8-4b33-a751-6ce34ec4c700'] }],
                    optionalServices: ['03b80e5a-ede8-4b33-a751-6ce34ec4c700']
                });
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService('03b80e5a-ede8-4b33-a751-6ce34ec4c700');
                const characteristic = await service.getCharacteristic('7772e5db-3868-4112-a1a9-f2669d106bf3');

                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', (e) => {
                    const value = e.target.value;
                    if (value.byteLength < 3) return;
                    const status = value.getUint8(2);
                    const note = value.getUint8(3);
                    const velocity = value.byteLength > 4 ? value.getUint8(4) : 0;
                    const command = status >> 4;

                    // UNIQUEMENT mise à jour visuelle (pas d'appel à playAcousticPiano ici)
                    if (command === 9 && velocity > 0) {
                        activateKey(note);
                    } else if (command === 8 || (command === 9 && velocity === 0)) {
                        deactivateKey(note);
                    }
                });

                document.getElementById('home-status').className = "w-3 h-3 rounded-full bg-emerald-500";
                document.getElementById('keyboard-status').textContent = "Connecté 🎹";
                document.getElementById('keyboard-status').className = "text-xs px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
                document.getElementById('btn-connect-home').textContent = "Piano Connecté ✓";
            } catch (err) {
                console.error(err);
            }
        }

        document.getElementById('btn-connect-home').addEventListener('click', connectBluetoothPiano);
    </script>
</body>
</html>
