<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helium Music - Roland FP-30X Companion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inclusion de soundfont-player pour charger le fichier .sf2 / échantillons -->
    <script src="https://cdn.jsdelivr.net/npm/soundfont-player@0.12.0/dist/soundfont-player.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#090d16',
                        cardbg: '#131c31',
                        accent: '#38bdf8'
                    }
                }
            }
        }
    </script>
    <style>
        .piano-keyboard-vertical {
            display: flex;
            position: relative;
            height: 75px;
            background: #020617;
            border-radius: 0.5rem;
            overflow-x: auto;
            padding: 3px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
            width: 100%;
        }
        .key {
            position: relative;
            border-radius: 0 0 2px 2px;
            transition: background 0.05s ease;
            flex-shrink: 0;
            cursor: pointer;
        }
        .key.white {
            width: 14px;
            height: 68px;
            background: #f8fafc;
            border: 1px solid #475569;
            z-index: 1;
        }
        .key.white.active {
            background: #38bdf8 !important;
            box-shadow: 0 0 6px #38bdf8;
        }
        .key.black {
            width: 9px;
            height: 40px;
            background: #0f172a;
            border: 1px solid #1e293b;
            margin-left: -4.5px;
            margin-right: -4.5px;
            z-index: 2;
            border-radius: 0 0 2px 2px;
        }
        .key.black.active {
            background: #0284c7 !important;
            box-shadow: 0 0 5px #0284c7;
        }
    </style>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen flex flex-col font-sans antialiased select-none">

    <!-- PAGE ACCUEIL -->
    <div id="view-home" class="flex-1 flex flex-col p-4 max-w-md w-full mx-auto justify-between space-y-4">
        <header class="flex items-center justify-between py-2">
            <div>
                <h1 class="font-bold text-xl tracking-tight text-white">Helium Music</h1>
                <p class="text-xs text-slate-400">Roland FP-30X Companion</p>
            </div>
            <div id="home-status" class="w-3 h-3 rounded-full bg-amber-500"></div>
        </header>

        <!-- Un seul grand carré : Clavier -->
        <div class="flex-1 flex flex-col justify-center">
            <button id="nav-to-keyboard" class="bg-cardbg border border-slate-800 hover:border-sky-500/50 rounded-2xl p-6 shadow-xl flex flex-col justify-between aspect-square text-left transition group">
                <div class="bg-sky-600/20 text-sky-400 p-4 rounded-xl w-fit border border-sky-500/30 group-hover:scale-105 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"/></svg>
                </div>
                <div>
                    <h2 class="font-bold text-lg text-slate-200">Clavier &amp; Visualiseur</h2>
                    <p class="text-xs text-slate-400 mt-1">Affichage des notes en direct &amp; Son Yamaha PSR-260</p>
                </div>
            </button>
        </div>

        <!-- Bouton Connexion Bluetooth -->
        <button id="btn-connect-home" class="w-full py-3.5 px-6 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm shadow-lg shadow-indigo-600/20 transition flex items-center justify-center space-x-2">
            <span>Connecter le Piano Bluetooth</span>
        </button>
    </div>

    <!-- PAGE CLAVIER / VISUALISEUR (Flux de notes traversant tout l'écran) -->
    <div id="view-keyboard-page" class="flex-1 hidden flex-col p-3 max-w-md w-full mx-auto justify-between space-y-2">
        <div class="flex items-center justify-between py-2 px-1">
            <button id="nav-to-home" class="text-slate-400 hover:text-white flex items-center space-x-1 text-sm font-medium">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                <span>Accueil</span>
            </button>
            <div id="chord-display" class="text-xs font-bold text-cyan-400 bg-slate-900 px-3 py-1 rounded-xl border border-slate-800">
                -
            </div>
            <div id="visu-status" class="w-2.5 h-2.5 rounded-full bg-amber-500"></div>
        </div>

        <!-- Zone de flux des notes montantes (monte jusqu'en haut) -->
        <div class="flex-1 bg-cardbg border border-slate-800 rounded-2xl p-2 relative overflow-hidden flex flex-col justify-end shadow-inner min-h-[360px]">
            <div id="notes-stream" class="w-full h-full flex items-end justify-center relative">
                <span class="text-xs text-slate-600 italic self-center">Chargement du son Yamaha PSR-260...</span>
            </div>
        </div>

        <!-- Clavier Virtuel Complet en bas -->
        <div class="bg-cardbg border border-slate-800 rounded-xl p-2 shadow-lg">
            <div id="keyboard-container" class="piano-keyboard-vertical"></div>
        </div>
    </div>

    <script>
        const viewHome = document.getElementById('view-home');
        const viewKeyboardPage = document.getElementById('view-keyboard-page');
        
        document.getElementById('nav-to-keyboard').addEventListener('click', () => {
            viewHome.classList.add('hidden');
            viewKeyboardPage.classList.remove('hidden');
        });
        document.getElementById('nav-to-home').addEventListener('click', () => {
            viewKeyboardPage.classList.add('hidden');
            viewHome.classList.remove('hidden');
        });

        // Gestion Audio & Chargement du SoundFont Yamaha PSR-260 depuis GitHub
        let audioCtx = null;
        let instrument = null;

            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                // Chargement du SoundFont depuis ton dépôt GitHub (remplace par le chemin brut ou l'URL de ton fichier)
                // Note : Assure-toi que le nom du fichier correspond exactement à celui sur GitHub (attention aux espaces ou remplace-le par un lien direct raw)
                Soundfont.instrument(audioCtx, 'Yamaha PSR 260 001 Grand Piano.sf2', {
                    // Si le fichier SF2 est directement à la racine du dépôt GitHub, le nom suffit. 
                    // Sinon indique le chemin relatif (ex: 'assets/Yamaha PSR 260 001 Grand Piano.sf2')
                }).then(inst => {
                    instrument = inst;
                    const italicText = document.querySelector('#notes-stream italic');
                    if (italicText) italicText.textContent = "Jouez sur votre piano...";
