<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helium Music - Roland FP-30X Companion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        cardbg: '#1e293b',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen flex flex-col font-sans antialiased">

    <!-- En-tête -->
    <header class="bg-cardbg border-b border-slate-800 p-4 shadow-md">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 p-2 rounded-xl text-white shadow-lg shadow-indigo-500/30">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l-2-2v13m2 0l12-3v-13l-12 3m-2 13l12-3" />
                    </svg>
                </div>
                <div>
                    <h1 class="font-bold text-lg tracking-wide">Helium Music</h1>
                    <p class="text-xs text-slate-400">Roland FP-30X • Bluetooth Direct</p>
                </div>
            </div>
            <button id="btn-refresh" class="text-slate-400 hover:text-white p-2 rounded-lg bg-slate-800 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
            </button>
        </div>
    </header>

    <!-- Contenu Principal -->
    <main class="flex-1 max-w-md w-full mx-auto p-4 space-y-4">

        <!-- Bouton de Connexion Bluetooth Principal -->
        <button id="btn-connect" class="w-full py-4 px-6 rounded-2xl bg-gradient-to-r from-cyan-500 to-indigo-600 text-white font-semibold text-lg shadow-lg shadow-indigo-500/25 active:scale-[0.98] transition flex items-center justify-center space-x-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 animate-pulse" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
            <span id="connect-text">Associer le Piano Bluetooth</span>
        </button>

        <!-- Statut de Connexion -->
        <div id="status-card" class="bg-cardbg border border-slate-800 rounded-2xl p-4 flex items-start space-x-3 transition">
            <div id="status-dot" class="w-3 h-3 rounded-full bg-amber-500 mt-1.5 shrink-0"></div>
            <div>
                <h2 id="status-title" class="font-medium text-sm text-slate-200">En attente d'association</h2>
                <p id="status-desc" class="text-xs text-slate-400 mt-0.5">Allumez votre Roland FP-30X et activez le Bluetooth de votre téléphone.</p>
            </div>
        </div>

        <!-- Moniteur MIDI en direct -->
        <div class="grid grid-cols-1 gap-4">
            <div class="bg-cardbg border border-slate-800 rounded-2xl p-4">
                <span class="text-xs font-semibold text-slate-400 tracking-wider uppercase">Dernière note</span>
                <div class="flex items-baseline space-x-2 mt-2">
                    <span id="note-name" class="text-3xl font-bold text-cyan-400">-</span>
                    <span id="note-freq" class="text-xs text-slate-500">MIDI ID</span>
                </div>
                <p id="note-sub" class="text-xs text-slate-400 mt-2">Aucune note jouée</p>
            </div>

            <div class="bg-cardbg border border-slate-800 rounded-2xl p-4">
                <span class="text-xs font-semibold text-slate-400 tracking-wider uppercase">Vélocité (Intensité)</span>
                <div class="flex items-baseline space-x-2 mt-2">
                    <span id="velocity-val" class="text-3xl font-bold text-indigo-400">-</span>
                </div>
                <p class="text-xs text-slate-400 mt-2">Force d'appui (0 - 127)</p>
            </div>

            <div class="bg-cardbg border border-slate-800 rounded-2xl p-4 flex items-center justify-between">
                <div>
                    <span class="text-xs font-semibold text-slate-400 tracking-wider uppercase">Pédale de Sustain</span>
                    <div id="sustain-val" class="text-2xl font-bold text-slate-200 mt-1">OFF</div>
                </div>
                <div id="sustain-indicator" class="w-12 h-12 rounded-full bg-slate-800 flex items-center justify-center transition">
                    <div class="w-4 h-4 rounded-full bg-slate-600 transition"></div>
                </div>
            </div>
        </div>

    </main>

    <script>
        const btnConnect = document.getElementById('btn-connect');
        const connectText = document.getElementById('connect-text');
        const btnRefresh = document.getElementById('btn-refresh');
        const statusDot = document.getElementById('status-dot');
        const statusTitle = document.getElementById('status-title');
        const statusDesc = document.getElementById('status-desc');
        
        const noteNameEl = document.getElementById('note-name');
        const noteSubEl = document.getElementById('note-sub');
        const velocityValEl = document.getElementById('velocity-val');
        const sustainValEl = document.getElementById('sustain-val');
        const sustainIndicator = document.getElementById('sustain-indicator').querySelector('div');

        const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        function midiNumberToName(midiNote) {
            const octave = Math.floor(midiNote / 12) - 1;
            return `${noteNames[midiNote % 12]}${octave}`;
        }

        async function connectBluetooth() {
            if (!navigator.bluetooth) {
                alert("Le Web Bluetooth n'est pas supporté par votre navigateur. Utilisez Google Chrome sur Android ou PC.");
                return;
            }

            try {
                connectText.textContent = "Recherche Bluetooth...";
                statusDot.className = "w-3 h-3 rounded-full bg-amber-500 mt-1.5 shrink-0 animate-ping";
                statusTitle.textContent = "Sélectionnez votre piano...";
                statusDesc.textContent = "Choisissez 'FP-30X' ou 'Roland' dans la liste de Chrome.";

                // Demande l'appareil Bluetooth MIDI standard (Service BLE MIDI: 03b80e5a-ede8-4b33-a751-6ce34ec4c700)
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ services: ['03b80e5a-ede8-4b33-a751-6ce34ec4c700'] }],
                    optionalServices: ['03b80e5a-ede8-4b33-a751-6ce34ec4c700']
                });

                statusTitle.textContent = "Connexion au serveur GATT...";
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService('03b80e5a-ede8-4b33-a751-6ce34ec4c700');
                const characteristic = await service.getCharacteristic('7772e5db-3868-4112-a1a9-f2669d106bf3');

                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', handleBluetoothMIDI);

                statusDot.className = "w-3 h-3 rounded-full bg-emerald-500 mt-1.5 shrink-0";
                statusTitle.textContent = "Piano connecté en Bluetooth !";
                statusDesc.textContent = device.name || "Roland FP-30X";
                connectText.textContent = "Connecté 🎹";
                btnConnect.classList.remove('from-cyan-500', 'to-indigo-600');
                btnConnect.classList.add('from-emerald-600', 'to-teal-600');

                device.addEventListener('gattserverdisconnected', () => {
                    statusDot.className = "w-3 h-3 rounded-full bg-red-500 mt-1.5 shrink-0";
                    statusTitle.textContent = "Piano déconnecté";
                    statusDesc.textContent = "Re-cliquez pour relier.";
                    connectText.textContent = "Reconnecter";
                });

            } catch (error) {
                console.error(error);
                statusDot.className = "w-3 h-3 rounded-full bg-red-500 mt-1.5 shrink-0";
                statusTitle.textContent = "Erreur de connexion";
                statusDesc.textContent = "Vérifiez que le Bluetooth est activé et réessayez.";
                connectText.textContent = "Réessayer";
            }
        }

        function handleBluetoothMIDI(event) {
            const value = event.target.value;
            // Le protocole BLE MIDI envoie un timestamp puis les données MIDI
            if (value.byteLength < 3) return;
            
            const status = value.getUint8(2);
            const note = value.getUint8(3);
            const velocity = value.byteLength > 4 ? value.getUint8(4) : 0;
            
            const command = status >> 4;

            if (command === 9 && velocity > 0) {
                noteNameEl.textContent = midiNumberToName(note);
                noteSubEl.textContent = `MIDI ID : ${note}`;
                velocityValEl.textContent = velocity;
            } else if (command === 11 && note === 64) {
                if (velocity >= 64) {
                    sustainValEl.textContent = "ON";
                    sustainIndicator.className = "w-4 h-4 rounded-full bg-indigo-500 shadow-lg shadow-indigo-500/50 scale-125 transition";
                } else {
                    sustainValEl.textContent = "OFF";
                    sustainIndicator.className = "w-4 h-4 rounded-full bg-slate-600 transition";
                }
            }
        }

        btnConnect.addEventListener('click', connectBluetooth);
        btnRefresh.addEventListener('click', () => window.location.reload());
    </script>
</body>
</html>
