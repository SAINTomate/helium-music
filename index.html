<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helium Music - Roland FP-30X Companion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#090d16',
                        cardbg: '#131c31',
                        accent: '#ff6600'
                    }
                }
            }
        }
    </script>
    <style>
        /* Clavier compact multi-octaves en bas de l'écran vertical */
        .piano-keyboard-vertical {
            display: flex;
            position: relative;
            height: 75px;
            background: #020617;
            border-radius: 0.5rem;
            overflow-x: auto;
            padding: 3px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
            width: 100%;
        }
        .key {
            position: relative;
            border-radius: 0 0 2px 2px;
            transition: background 0.05s ease;
            flex-shrink: 0;
            cursor: pointer;
        }
        .key.white {
            width: 14px;
            height: 68px;
            background: #f8fafc;
            border: 1px solid #475569;
            z-index: 1;
        }
        .key.white.active {
            background: #ff6600 !important;
            box-shadow: 0 0 6px #ff6600;
        }
        .key.black {
            width: 9px;
            height: 40px;
            background: #0f172a;
            border: 1px solid #1e293b;
            margin-left: -4.5px;
            margin-right: -4.5px;
            z-index: 2;
            border-radius: 0 0 2px 2px;
        }
        .key.black.active {
            background: #ea580c !important;
            box-shadow: 0 0 5px #ea580c;
        }
    </style>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen flex flex-col font-sans antialiased select-none">

    <!-- PAGE ACCUEIL (Dashboard style Roland App) -->
    <div id="view-home" class="flex-1 flex flex-col p-4 max-w-md w-full mx-auto justify-between space-y-3">
        <header class="flex items-center justify-between py-2">
            <h1 class="font-bold text-xl tracking-tight text-white">Dashboard</h1>
            <div id="home-status" class="w-3 h-3 rounded-full bg-amber-500"></div>
        </header>

        <!-- Cartes du Dashboard -->
        <div class="flex-1 flex flex-col space-y-3 justify-center">
            <!-- Carte Library -->
            <div class="bg-cardbg border border-slate-800 rounded-2xl p-4 shadow-md flex items-center justify-between">
                <div>
                    <span class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Library</span>
                    <h2 class="font-bold text-sm text-slate-200 mt-0.5">Classical Melodies Vol.1</h2>
                </div>
                <div class="bg-orange-600 text-white p-2.5 rounded-xl shadow">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 fill-current" viewBox="0 0 20 20"><path d="M6 4l12 6-12 6V4z"/></svg>
                </div>
            </div>

            <!-- Carte Recorder / Visualiseur -->
            <button id="nav-to-recorder" class="bg-cardbg border border-slate-800 hover:border-orange-500/50 rounded-2xl p-4 shadow-md flex items-center justify-between text-left transition group">
                <div>
                    <span class="text-xs text-orange-500 uppercase tracking-wider font-semibold">Recorder</span>
                    <h2 class="font-bold text-sm text-slate-200 mt-0.5">Visualiseur &amp; Enregistrement</h2>
                </div>
                <div class="bg-orange-600/20 text-orange-500 p-3 rounded-xl border border-orange-500/30 group-hover:scale-105 transition">
                    <div class="w-3 h-3 rounded-full bg-orange-500 animate-pulse"></div>
                </div>
            </button>

            <!-- Carte Accompaniment -->
            <div class="bg-cardbg border border-slate-800 rounded-2xl p-4 shadow-md flex items-center justify-between opacity-75">
                <div>
                    <span class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Accompaniment</span>
                    <h2 class="font-bold text-sm text-slate-300 mt-0.5">Styles &amp; Rythmes</h2>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
            </div>
        </div>

        <!-- Bouton Connexion Bluetooth -->
        <button id="btn-connect-home" class="w-full py-3.5 px-6 rounded-2xl bg-orange-600 hover:bg-orange-500 text-white font-semibold text-sm shadow-lg shadow-orange-600/20 transition flex items-center justify-center space-x-2">
            <span>Connecter le Piano Bluetooth</span>
        </button>
    </div>

    <!-- PAGE RECORDER / VISUALISEUR (Vertical avec flux de notes et clavier en bas) -->
    <div id="view-recorder" class="flex-1 hidden flex-col p-3 max-w-md w-full mx-auto justify-between space-y-2">
        <!-- En-tête style Recorder -->
        <div class="flex items-center justify-between py-2 px-1">
            <button id="nav-to-home" class="text-slate-400 hover:text-white flex items-center space-x-1 text-sm font-medium">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                <span>Recorder</span>
            </button>
            <div class="flex items-center space-x-2">
                <div id="rec-status-dot" class="w-2.5 h-2.5 rounded-full bg-amber-500"></div>
                <span id="timer-display" class="text-xs font-mono text-slate-300">00:00:00</span>
            </div>
        </div>

        <!-- Zone d'affichage des traits de notes montants (Piano Roll vertical) -->
        <div class="flex-1 bg-cardbg border border-slate-800 rounded-2xl p-2 relative overflow-hidden flex flex-col justify-end shadow-inner min-h-[320px]">
            <div id="notes-stream" class="w-full h-full flex items-end justify-center relative">
                <span class="text-xs text-slate-600 italic self-center">Prêt - Jouez sur votre piano...</span>
            </div>
        </div>

        <!-- Clavier Virtuel Complet en bas (style compact multi-octaves) -->
        <div class="bg-cardbg border border-slate-800 rounded-xl p-2 shadow-lg">
            <div id="keyboard-container" class="piano-keyboard-vertical"></div>
        </div>
    </div>

    <script>
        const viewHome = document.getElementById('view-home');
        const viewRecorder = document.getElementById('view-recorder');
        
        document.getElementById('nav-to-recorder').addEventListener('click', () => {
            viewHome.classList.add('hidden');
            viewRecorder.classList.remove('hidden');
        });
        document.getElementById('nav-to-home').addEventListener('click', () => {
            viewRecorder.classList.add('hidden');
            viewHome.classList.remove('hidden');
        });

        // Synthétiseur interne harmonisé et propre (sans son électrique/frissonnant)
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playCleanPianoTone(midiNote) {
            initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const freq = 440 * Math.pow(2, (midiNote - 69) / 12);
            const now = audioCtx.currentTime;

            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            // Onde sinusoïdale pure filtrée pour un rendu acoustique propre et neutre
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now);

            gainNode.gain.setValueAtTime(0, now);
            gainNode.gain.linearRampToValueAtTime(0.3, now + 0.02);
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 1.5);

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 1.5);
        }

        // Génération du Clavier Complet (C2=36 à C7=96)
        const keyboardContainer = document.getElementById('keyboard-container');
        const noteNamesGlobal = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        const keyElements = {};
        let activeNotes = new Set();

        function buildKeyboard() {
            for (let midi = 36; midi <= 96; midi++) {
                const name = noteNamesGlobal[midi % 12];
                const isBlack = name.includes('#');
                const key = document.createElement('div');
                key.className = `key ${isBlack ? 'black' : 'white'}`;
                key.dataset.midi = midi;

                // Test tactile (avec le son propre unifié)
                key.addEventListener('mousedown', () => {
                    playCleanPianoTone(midi);
                    activateKey(midi);
                });
                key.addEventListener('mouseup', () => deactivateKey(midi));
                key.addEventListener('mouseleave', () => deactivateKey(midi));

                keyboardContainer.appendChild(key);
                keyElements[midi] = key;
            }
        }
        buildKeyboard();

        function activateKey(midi) {
            activeNotes.add(midi);
            if (keyElements[midi]) keyElements[midi].classList.add('active');
            spawnFallingNote(midi);
        }

        function deactivateKey(midi) {
            activeNotes.delete(midi);
            if (keyElements[midi]) keyElements[midi].classList.remove('active');
        }

        // Animation des traits montants (flux de notes)
        const notesStream = document.getElementById('notes-stream');
        function spawnFallingNote(midi) {
            if (notesStream.querySelector('italic')) {
                notesStream.innerHTML = '';
            }
            const bar = document.createElement('div');
            bar.className = 'absolute bottom-0 w-1.5 bg-orange-500 rounded-t-full transition-all duration-1000 opacity-90';
            
            const percent = ((midi - 36) / (96 - 36)) * 95;
            bar.style.left = percent + '%';
            bar.style.height = '6px';
            
            notesStream.appendChild(bar);

            setTimeout(() => {
                bar.style.height = '100%';
                bar.style.opacity = '0';
            }, 20);

            setTimeout(() => {
                bar.remove();
            }, 1000);
        }

        // Connexion Bluetooth MIDI (Visuelle uniquement, pas de double son)
        async function connectBluetoothPiano() {
            try {
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ services: ['03b80e5a-ede8-4b33-a751-6ce34ec4c700'] }],
                    optionalServices: ['03b80e5a-ede8-4b33-a751-6ce34ec4c700']
                });
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService('03b80e5a-ede8-4b33-a751-6ce34ec4c700');
                const characteristic = await service.getCharacteristic('7772e5db-3868-4112-a1a9-f2669d106bf3');

                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', (e) => {
                    const value = e.target.value;
                    if (value.byteLength < 3) return;
                    const status = value.getUint8(2);
                    const note = value.getUint8(3);
                    const velocity = value.byteLength > 4 ? value.getUint8(4) : 0;
                    const command = status >> 4;

                    if (command === 9 && velocity > 0) {
                        activateKey(note);
                    } else if (command === 8 || (command === 9 && velocity === 0)) {
                        deactivateKey(note);
                    }
                });

                document.getElementById('home-status').className = "w-3 h-3 rounded-full bg-emerald-500";
                document.getElementById('rec-status-dot').className = "w-2.5 h-2.5 rounded-full bg-emerald-500";
                document.getElementById('btn-connect-home').textContent = "Piano Connecté ✓";
            } catch (err) {
                console.error(err);
            }
        }

        document.getElementById('btn-connect-home').addEventListener('click', connectBluetoothPiano);
    </script>
</body>
</html>
