<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helium Music - Roland FP-30X Companion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inclusion de la bibliothèque soundfont-player pour lire les fichiers .sf2 -->
    <script src="https://cdn.jsdelivr.net/npm/soundfont-player@0.12.0/dist/soundfont-player.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#090d16',
                        cardbg: '#131c31',
                        accent: '#ff6600'
                    }
                }
            }
        }
    </script>
    <style>
        /* Clavier compact multi-octaves en bas de l'écran vertical */
        .piano-keyboard-vertical {
            display: flex;
            position: relative;
            height: 75px;
            background: #020617;
            border-radius: 0.5rem;
            overflow-x: auto;
            padding: 3px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
            width: 100%;
        }
        .key {
            position: relative;
            border-radius: 0 0 2px 2px;
            transition: background 0.05s ease;
            flex-shrink: 0;
            cursor: pointer;
        }
        .key.white {
            width: 14px;
            height: 68px;
            background: #f8fafc;
            border: 1px solid #475569;
            z-index: 1;
        }
        .key.white.active {
            background: #ff6600 !important;
            box-shadow: 0 0 6px #ff6600;
        }
        .key.black {
            width: 9px;
            height: 40px;
            background: #0f172a;
            border: 1px solid #1e293b;
            margin-left: -4.5px;
            margin-right: -4.5px;
            z-index: 2;
            border-radius: 0 0 2px 2px;
        }
        .key.black.active {
            background: #ea580c !important;
            box-shadow: 0 0 5px #ea580c;
        }
    </style>
</head>
