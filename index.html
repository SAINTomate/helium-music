<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helium Music - Roland FP-30X Companion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#090d16',
                        cardbg: '#131c31',
                        accent: '#ff6600'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen flex flex-col font-sans antialiased select-none">

    <!-- PAGE ACCUEIL -->
    <div id="view-home" class="flex-1 flex flex-col p-4 max-w-md w-full mx-auto justify-between space-y-4">
        <!-- En-tête : Titre et Connexion -->
        <header class="flex items-center justify-between py-3">
            <h1 class="font-extrabold text-4xl tracking-tight text-white">Helium Music</h1>
            
            <button id="btn-connect-home" class="bg-cardbg border border-slate-800 hover:border-orange-500/50 py-3 px-5 rounded-2xl shadow-lg flex items-center space-x-3 transition">
                <span class="text-sm font-semibold text-slate-200">Connexion piano</span>
                <div id="home-status" class="w-4 h-4 rounded-full bg-orange-500"></div>
            </button>
        </header>

        <!-- Cartes du Dashboard -->
        <div class="flex-1 flex flex-col space-y-4 justify-center">
            
            <!-- Section Morceau Actuel -->
            <div class="bg-cardbg border border-slate-800 rounded-3xl p-6 shadow-lg flex flex-col space-y-4">
                <div class="flex items-center justify-between">
                    <div>
                        <span class="text-xs text-orange-500 uppercase tracking-wider font-bold">En cours de diffusion</span>
                        <h2 class="font-bold text-xl text-slate-100 mt-1" id="current-track-title">Classical Melodies Vol.1</h2>
                    </div>
                </div>
                <div class="flex items-center justify-between pt-2 border-t border-slate-800/80">
                    <span class="text-xs text-slate-400 font-mono" id="track-time">00:00 / 03:45</span>
                    <button id="btn-play-pause" class="bg-orange-600 hover:bg-orange-500 text-white p-3.5 rounded-2xl shadow-md transition flex items-center justify-center">
                        <svg id="icon-play" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 fill-current" viewBox="0 0 20 20"><path d="M6 4l12 6-12 6V4z"/></svg>
                        <svg id="icon-pause" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 fill-current hidden" viewBox="0 0 20 20"><path d="M5 4h3v12H5V4zm7 0h3v12h-3V4z"/></svg>
                    </button>
                </div>
            </div>

            <!-- Carte Recorder / Enregistrement -->
            <button id="nav-to-recorder" class="bg-cardbg border border-slate-800 hover:border-orange-500/50 rounded-3xl p-6 shadow-lg flex items-center justify-between text-left transition group">
                <div>
                    <span class="text-xs text-orange-500 uppercase tracking-wider font-bold">Recorder</span>
                    <h2 class="font-bold text-lg text-slate-100 mt-1">Enregistrement &amp; Restitution</h2>
                </div>
                <div class="bg-orange-600/20 text-orange-500 p-4 rounded-2xl border border-orange-500/30 group-hover:scale-105 transition">
                    <div class="w-4 h-4 rounded-full bg-orange-500 animate-pulse"></div>
                </div>
            </button>

            <!-- Carte Accompaniment -->
            <div class="bg-cardbg border border-slate-800 rounded-3xl p-6 shadow-lg flex items-center justify-between opacity-75">
                <div>
                    <span class="text-xs text-slate-400 uppercase tracking-wider font-bold">Accompaniment</span>
                    <h2 class="font-bold text-lg text-slate-200 mt-1">Styles &amp; Rythmes</h2>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
            </div>
        </div>

        <div></div>
    </div>

    <!-- PAGE RECORDER / ENREGISTREMENT -->
    <div id="view-recorder" class="flex-1 hidden flex-col p-4 max-w-md w-full mx-auto justify-between space-y-4">
        <!-- En-tête -->
        <div class="flex items-center justify-between py-2">
            <button id="nav-to-home" class="text-slate-400 hover:text-white flex items-center space-x-1 text-sm font-medium">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                <span>Retour</span>
            </button>
            <div class="flex items-center space-x-2">
                <div id="rec-status-dot" class="w-2.5 h-2.5 rounded-full bg-slate-600"></div>
                <span id="timer-display" class="text-xs font-mono text-slate-300">00:00</span>
            </div>
        </div>

        <!-- Zone centrale : Statut et informations -->
        <div class="flex-1 bg-cardbg border border-slate-800 rounded-3xl p-6 flex flex-col items-center justify-center space-y-6 shadow-lg">
            <div id="rec-state-text" class="text-slate-400 text-sm font-medium">Prêt à enregistrer</div>
            
            <div class="text-center">
                <span id="recorded-notes-count" class="text-4xl font-extrabold text-white">0</span>
                <p class="text-xs text-slate-500 uppercase tracking-wider mt-1">Notes enregistrées</p>
            </div>
        </div>

        <!-- Contrôles d'enregistrement -->
        <div class="bg-cardbg border border-slate-800 rounded-3xl p-5 shadow-lg flex items-center justify-around">
            <button id="btn-start-rec" class="bg-red-600 hover:bg-red-500 text-white p-4 rounded-2xl shadow-md transition flex items-center space-x-2">
                <div class="w-4 h-4 rounded-full bg-white animate-pulse"></div>
                <span class="text-sm font-semibold">Enregistrer</span>
            </button>

            <button id="btn-stop-rec" class="bg-slate-800 hover:bg-slate-700 text-slate-300 p-4 rounded-2xl shadow-md transition" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 fill-current" viewBox="0 0 20 20"><path d="M5 5h10v10H5z"/></svg>
            </button>

            <button id="btn-play-rec" class="bg-orange-600 hover:bg-orange-500 text-white p-4 rounded-2xl shadow-md transition flex items-center space-x-2" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 fill-current" viewBox="0 0 20 20"><path d="M6 4l12 6-12 6V4z"/></svg>
                <span class="text-sm font-semibold">Écouter</span>
            </button>
        </div>
    </div>

    <!-- SCRIPTS LOGIQUE -->
    <script>
        const viewHome = document.getElementById('view-home');
        const viewRecorder = document.getElementById('view-recorder');
        
        document.getElementById('nav-to-recorder').addEventListener('click', () => {
            viewHome.classList.add('hidden');
            viewRecorder.classList.remove('hidden');
        });
        document.getElementById('nav-to-home').addEventListener('click', () => {
            viewRecorder.classList.add('hidden');
            viewHome.classList.remove('hidden');
        });

        // Gestion bascule Play / Pause lecteur principal
        const btnPlayPause = document.getElementById('btn-play-pause');
        const iconPlay = document.getElementById('icon-play');
        const iconPause = document.getElementById('icon-pause');
        let isPlaying = false;

        btnPlayPause.addEventListener('click', () => {
            isPlaying = !isPlaying;
            if (isPlaying) {
                iconPlay.classList.add('hidden');
                iconPause.classList.remove('hidden');
            } else {
                iconPause.classList.add('hidden');
                iconPlay.classList.remove('hidden');
            }
        });

        // Audio de base (synthétiseur temporaire de secours)
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playCleanPianoTone(midiNote) {
            initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const freq = 440 * Math.pow(2, (midiNote - 69) / 12);
            const now = audioCtx.currentTime;

            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now);

            gainNode.gain.setValueAtTime(0, now);
            gainNode.gain.linearRampToValueAtTime(0.3, now + 0.02);
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 1.5);

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 1.5);
        }

        // Logique d'enregistrement
        let isRecording = false;
        let recordingStartTime = 0;
        let recordedEvents = [];
        let timerInterval = null;

        const btnStartRec = document.getElementById('btn-start-rec');
        const btnStopRec = document.getElementById('btn-stop-rec');
        const btnPlayRec = document.getElementById('btn-play-rec');
        const recStatusDot = document.getElementById('rec-status-dot');
        const recStateText = document.getElementById('rec-state-text');
        const recordedNotesCount = document.getElementById('recorded-notes-count');
        const timerDisplay = document.getElementById('timer-display');

        btnStartRec.addEventListener('click', () => {
            isRecording = true;
            recordedEvents = [];
            recordingStartTime = Date.now();
            
            btnStartRec.disabled = true;
            btnStopRec.disabled = false;
            btnPlayRec.disabled = true;
            
            recStatusDot.className = "w-2.5 h-2.5 rounded-full bg-red-500 animate-ping";
            recStateText.textContent = "Enregistrement en cours...";
            
            let seconds = 0;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                seconds++;
                let m = Math.floor(seconds / 60).toString().padStart(2, '0');
                let s = (seconds % 60).toString().padStart(2, '0');
                timerDisplay.textContent = `${m}:${s}`;
            }, 1000);
        });

        btnStopRec.addEventListener('click', () => {
            isRecording = false;
            clearInterval(timerInterval);
            
            btnStartRec.disabled = false;
            btnStopRec.disabled = true;
            btnPlayRec.disabled = recordedEvents.length === 0;
            
            recStatusDot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500";
            recStateText.textContent = "Enregistrement terminé";
        });

        function handleMidiMessage(note, velocity, command) {
            if (isRecording) {
                const timestamp = Date.now() - recordingStartTime;
                recordedEvents.push({ timestamp, note, velocity, command });
                recordedNotesCount.textContent = recordedEvents.length;
            }
        }

        btnPlayRec.addEventListener('click', () => {
            if (recordedEvents.length === 0) return;
            
            recStateText.textContent = "Lecture de votre performance...";
            btnPlayRec.disabled = true;

            recordedEvents.forEach(event => {
                setTimeout(() => {
                    if (event.command === 9 && event.velocity > 0) {
                        playCleanPianoTone(event.note);
                    }
                }, event.timestamp);
            });

            const totalDuration = recordedEvents[recordedEvents.length - 1].timestamp + 1500;
            setTimeout(() => {
                recStateText.textContent = "Lecture terminée";
                btnPlayRec.disabled = false;
            }, totalDuration);
        });

        // Connexion Bluetooth MIDI
        async function connectBluetoothPiano() {
            try {
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ services: ['03b80e5a-ede8-4b33-a751-6ce34ec4c700'] }],
                    optionalServices: ['03b80e5a-ede8-4b33-a751-6ce34ec4c700']
                });
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService('03b80e5a-ede8-4b33-a751-6ce34ec4c700');
                const characteristic = await service.getCharacteristic('7772e5db-3868-4112-a1a9-f2669d106bf3');

                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', (e) => {
                    const value = e.target.value;
                    if (value.byteLength < 3) return;
                    const status = value.getUint8(2);
                    const note = value.getUint8(3);
                    const velocity = value.byteLength > 4 ? value.getUint8(4) : 0;
                    const command = status >> 4;

                    if (command === 9 && velocity > 0) {
                        playCleanPianoTone(note);
                        handleMidiMessage(note, velocity, 9);
                    } else if (command === 8 || (command === 9 && velocity === 0)) {
                        handleMidiMessage(note, velocity, 8);
                    }
                });

                document.getElementById('home-status').className = "w-4 h-4 rounded-full bg-emerald-500";
                document.getElementById('rec-status-dot').className = "w-2.5 h-2.5 rounded-full bg-emerald-500";
            } catch (err) {
                console.error(err);
            }
        }

        document.getElementById('btn-connect-home').addEventListener('click', connectBluetoothPiano);
    </script>
</body>
</html>
